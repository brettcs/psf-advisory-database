name: Sync
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  update-osv-from-cve:
    name: "Synchronize CVE and OSV"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v3
        with:
          repository: python/cpython
          path: cpython
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-editable --no-dev

      - run: |
          uv run python -m psf_advisorydb.cpython2cve
          uv run python -m psf_advisorydb.cve2db
        env:
          CVE_ENV: "prod"
          CVE_USERNAME: "cna@python.org"
          CVE_API_TOKEN: ${{ secrets.CVE_API_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CPYTHON_REPO: ./cpython

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v6
        with:
          title: "Update OSV records from CVE"
          commit-message: "Update OSV records from CVE"
          reviewers: sethmlarson,jacobcoffee,brettcs
          add-paths: |
            advisories/
