name: Sync
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  update-osv-from-cve:
    name: "Synchronize CVE and OSV"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v3
        with:
          repository: python/cpython
          path: cpython
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v4
        with:
          python-version: 3.15

      - run: |
          python -m pip install -r tools/requirements.txt
          python tools/sync-cpython-backports-to-cve.py
          python tools/import-from-cve.py
        env:
          CVE_ENV: "prod"
          CVE_USERNAME: "cna@python.org"
          CVE_API_TOKEN: ${{ secrets.CVE_API_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CPYTHON_REPO: ./cpython

      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v6
        with:
          title: "Update OSV records from CVE"
          commit-message: "Update OSV records from CVE"
          reviewers: sethmlarson,jacobcoffee,brettcs
          add-paths: |
            advisories/
