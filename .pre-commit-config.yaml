repos:
- repo: https://github.com/python-jsonschema/check-jsonschema
  rev: 0.39.0
  hooks:
  - id: check-jsonschema
    files: "^advisories/[a-z0-9_-]+/.+\\.json$"
    args: [--schemafile, tools/osv-schema.json]
- repo: https://github.com/pycqa/isort
  rev: 9.0.2
  hooks:
  - id: isort
- repo: https://github.com/psf/black
  rev: 26.10.1
  hooks:
  - id: black
